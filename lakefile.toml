name = "InteractionCombinators"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["InteractionCombinators", "Checks"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "InteractionCombinators"

# Checks of the library: examples, non-vacuity tests and attempts to refute its statements.
# Nothing in `InteractionCombinators` depends on them.
[[lean_lib]]
name = "Checks"
